name: MirvDesk Full CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/full/**'

concurrency:
  group: mirvdesk-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Require self-hosted MirvDesk server URL
        env:
          MIRVDESK_SERVER_URL: ${{ vars.MIRVDESK_SERVER_URL }}
        run: .github/scripts/validate-mirvdesk-config.sh

  run-full-ci:
    needs: validate-config
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: false
      smoke: false
