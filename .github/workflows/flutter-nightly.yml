name: MirvDesk Nightly Build

on:
  schedule:
    # schedule build every night
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - name: Require self-hosted MirvDesk server URL
        shell: bash
        env:
          MIRVDESK_SERVER_URL: ${{ vars.MIRVDESK_SERVER_URL }}
        run: |
          set -euo pipefail
          url="${MIRVDESK_SERVER_URL%/}"
          if [[ -z "$url" ]]; then
            echo "::error::MIRVDESK_SERVER_URL is required. Deploy your own MirvDesk Server and create this repository variable before building."
            exit 1
          fi
          case "$url" in
            http://*|https://*) ;;
            *) echo "::error::MIRVDESK_SERVER_URL must start with http:// or https://"; exit 1 ;;
          esac

  run-flutter-nightly-build:
    needs: validate-config
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
      smoke: true
