name: MirvDesk Tag Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Require self-hosted MirvDesk server URL
        shell: bash
        env:
          MIRVDESK_SERVER_URL: ${{ vars.MIRVDESK_SERVER_URL }}
        run: |
          set -euo pipefail
          url="${MIRVDESK_SERVER_URL%/}"
          if [[ -z "$url" ]]; then
            echo "::error::MIRVDESK_SERVER_URL is required. Deploy your own MirvDesk Server and create this repository variable before tagging a release."
            exit 1
          fi
          case "$url" in
            http://*|https://*) ;;
            *) echo "::error::MIRVDESK_SERVER_URL must start with http:// or https://"; exit 1 ;;
          esac

      - name: Create MirvDesk release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ github.ref_name }}
          name: MirvDesk ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: false
          body: |
            MirvDesk ${{ github.ref_name }} is a self-hosted remote desktop client based on RustDesk.

            v1.5.1 fixes bootstrap URL propagation into containerized Linux builds. Linux release CI now verifies that the configured bootstrap URL is actually embedded before a package can be published.

            MirvDesk deliberately has no public/default server. Builders must deploy their own MirvDesk Server and create the `MIRVDESK_SERVER_URL` repository variable before compiling or publishing a release; missing or empty values now fail the build. The server project is https://github.com/mirivlad/mirvdesk-server.

            MirvDesk remains branded and isolated from an installed RustDesk client. Personal Address Book remains available; the upstream Accessible devices / Groups panel is hidden until the MirvDesk server implements that API. Stock RustDesk auto-update remains disabled.

            Packages are built by GitHub Actions for Windows, Linux, macOS and Android.

  run-flutter-tag-build:
    needs: prepare-release
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
      prerelease: false
