name: MirvDesk Tag Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

concurrency:
  group: mirvdesk-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release validation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Require self-hosted MirvDesk server URL
        env:
          MIRVDESK_SERVER_URL: ${{ vars.MIRVDESK_SERVER_URL }}
        run: .github/scripts/validate-mirvdesk-config.sh

      - name: Validate MirvDesk release invariants
        run: python3 .github/scripts/validate-mirvdesk-repo.py

      - name: Create MirvDesk release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ github.ref_name }}
          name: MirvDesk ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: false
          body: |
            MirvDesk ${{ github.ref_name }} is a self-hosted remote desktop client based on RustDesk.

            **1.6.2** corrects mobile network option retrieval without desktop
            IPC on iOS and Android, and keeps the delayed relay attempt alive
            even when direct P2P fails before the fallback timer expires.

            **1.6.1** hedges stalled P2P attempts by starting hbbr relay setup
            after a short head start, without cancelling the direct attempt.
            Android discovery now happens before NAT probes, and release CI
            verifies MIRVDESK_SERVER_URL in each native APK library.

            Builds require MIRVDESK_SERVER_URL pointing to your own server.
            MirvDesk deliberately ships with no default public server.

            Personal Address Book remains available. Shared address books are not implemented yet. Stock RustDesk auto-update remains disabled so MirvDesk cannot replace itself with an upstream RustDesk build.

            Packages are built by GitHub Actions for Windows, Linux, macOS and Android.

  run-flutter-tag-build:
    needs: prepare-release
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
      prerelease: false
