name: MirvDesk Tag Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - 'v1.7.0-*'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

concurrency:
  group: mirvdesk-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release validation
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Require self-hosted MirvDesk server URL
        env:
          MIRVDESK_SERVER_URL: ${{ vars.MIRVDESK_SERVER_URL }}
        run: .github/scripts/validate-mirvdesk-config.sh

      - name: Validate MirvDesk release invariants
        run: python3 .github/scripts/validate-mirvdesk-repo.py

      - name: Create MirvDesk release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ github.ref_name }}
          name: MirvDesk ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          body: |
            MirvDesk ${{ github.ref_name }} is a self-hosted remote desktop client based on RustDesk.

            **1.7.3**: Automatic discovery of connected rendezvous device
            identities without account login; signed host-service heartbeats,
            verified online status, device display names, inventory search
            and All / My / Accessible scope views. Requires MirvDesk Server
            with device-registry-v1 support. Device presence and group
            visibility do not confer remote-control permissions.

            **1.7.2**: Native administrator console added under
            Settings → Account → Manage users and devices for signed-in
            server administrators. Manage users (create/disable/password),
            groups, device group memberships, device notes and audit history.
            Requires MirvDesk Server 1.7.1 or newer with administrator API.
            Windows/Linux user-addressed connections remain available.

            **1.7.1**: Addresses can target an OS user (ID\\username);
            Windows session selection, Linux logind discovery and session
            binding, and self-hosted-account UI improvements are included.
            True simultaneous remote streaming of independent Linux user
            sessions is NOT implemented yet. These features need real-device
            acceptance testing.

            **Automatic updates:** On Debian-based Linux, installed .deb
            packages include a systemd update timer which verifies SHA-256
            release-asset digests and delays installation while remote
            sessions are active. Installed Windows clients check and update
            using their own GitHub release assets. Existing 1.6.x installs
            need 1.7.1 installed manually once before auto-update is available.
            macOS and Android updates still require explicit installation.

            Updates only come from github.com/mirivlad/mirvdesk-client;
            the upstream RustDesk updater stays disabled for MirvDesk.

            Builds require MIRVDESK_SERVER_URL pointing to your own server.
            MirvDesk deliberately ships with no default public server.
            CI packages cover Windows, Linux, macOS, and Android.

  run-flutter-tag-build:
    needs: prepare-release
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
      prerelease: ${{ contains(github.ref_name, '-') }}
